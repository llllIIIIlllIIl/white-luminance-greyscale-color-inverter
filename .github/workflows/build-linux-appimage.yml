name: Build AppImage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2 file imagemagick
    
    - name: Download appimagetool
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
    
    - name: Prepare AppDir
      run: |
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/applications
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
    
    - name: Create placeholder icon
      run: |
        convert -size 256x256 xc:blue -pointsize 72 -fill white -gravity center -annotate +0+0 "App" AppDir/yourapp.png
    
    - name: Create desktop file
      run: |
        cat > AppDir/yourapp.desktop << 'EOF'
        [Desktop Entry]
        Type=Application
        Name=YourApp
        Exec=yourapp
        Icon=yourapp
        Categories=Utility;
        EOF
    
    - name: Create AppRun
      run: |
        cat > AppDir/AppRun << 'EOF'
        #!/bin/bash
        SELF=$(readlink -f "$0")
        HERE=${SELF%/*}
        export PATH="${HERE}/usr/bin:${PATH}"
        exec "${HERE}/usr/bin/yourapp" "$@"
        EOF
        chmod +x AppDir/AppRun
    
    - name: Build AppImage
      run: |
        ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir YourApp-x86_64.AppImage
    
    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: AppImage
        path: '*.AppImage'
        retention-days: 30
