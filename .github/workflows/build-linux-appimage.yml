name: build-linux-appimage

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build binary
        run: |
          pyinstaller --onefile --name white-luminance-greyscale-color-inverter white-luminance-greyscale-color-inverter.py

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/white-luminance-greyscale-color-inverter AppDir/usr/bin/
          cat > AppDir/white-luminance-greyscale-color-inverter.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=White Luminance Greyscale Color Inverter
          Exec=white-luminance-greyscale-color-inverter
          Icon=white-luminance-greyscale-color-inverter
          Categories=Utility;
          EOF
          cp AppDir/white-luminance-greyscale-color-inverter.desktop AppDir/usr/share/applications/
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/white-luminance-greyscale-color-inverter" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ./appimagetool-x86_64.AppImage AppDir

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: "*.AppImage"
